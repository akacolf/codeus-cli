[package]
name = "codeus"
version = "0.1.0"
edition = "2021"
description = "Terminal-native companion to QC Codeus"
license = "UNLICENSED"
publish = false
default-run = "codeus"

[dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6.0"
futures-util = "0.3"
ignore = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shlex = "2.0"
tokio = { version = "1.48", features = ["full"] }
toml = "0.9"
tower = "0.5"
tracing = "0.1"
vercel_runtime = { version = "2", features = ["axum"] }

[[bin]]
name = "codeus"
path = "src/main.rs"

[[bin]]
name = "codeus_vercel_api"
path = "api/index.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"
